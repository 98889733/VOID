          KS

      - name: Найти проект (zip или файлы в корне)
        run: |
          set -e
          mkdir -p _proj
          if ls *.zip >/dev/null 2>&1; then
            ZIP="$(ls -t *.zip | head -1)"
            echo "Распаковываю: $ZIP"
            unzip -q -o "$ZIP" -d _proj
            BASE="$(basename "$ZIP" .zip)"
          else
            echo "zip не найден, беру файлы из репозитория"
            rsync -a --exclude='/.git' --exclude='/_proj' ./ _proj/
            BASE="${GITHUB_REPOSITORY#*/}"
          fi
          # Для веб-проектов: у каждого zip свой ID, чтобы приложения не конфликтовали
          H="$(printf '%s' "$BASE" | md5sum | cut -c1-8)"
          echo "WEB_APP_NAME=$BASE" >> "$GITHUB_ENV"
          echo "WEB_APP_ID=com.game.g$H" >> "$GITHUB_ENV"
          G="$(find _proj \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/node_modules/*' | head -1)"
          if [ -n "$G" ]; then
            echo "Тип: Android-проект (Gradle)"
            echo "TYPE=native" >> "$GITHUB_ENV"
            echo "SRC=$(dirname "$G")" >> "$GITHUB_ENV"
          else
            I="$(find _proj -name index.html -not -path '*/node_modules/*' | head -1)"
            if [ -z "$I" ]; then
              echo "::error::Не найден ни Android-проект (settings.gradle), ни index.html"
              exit 1
            fi
            echo "Тип: веб-проект (Capacitor)"
            echo "TYPE=web" >> "$GITHUB_ENV"
            echo "SRC=$(dirname "$I")" >> "$GITHUB_ENV"
          fi

      - name: Собрать APK (Android-проект)
        if: env.TYPE == 'native'
        working-directory: ${{ env.SRC }}
        run: |
          set -e
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew assembleDebug --no-daemon --stacktrace; else gradle assembleDebug --no-daemon --stacktrace; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          APK="$(find . -path '*build/outputs/apk/debug/*.apk' | head -1)"
          [ -n "$APK" ] || { echo "::error::APK не найден после сборки"; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/out/app-debug.apk"

      - name: Собрать APK (веб-проект)
        if: env.TYPE == 'web'
        run: |
          set -e
          mkdir -p app/www && cd app
          cp -r "../$SRC"/* www/
          npm init -y >/dev/null
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 three@0.160.0
          cp node_modules/three/build/three.module.js www/three.module.js
          npx cap init "$WEB_APP_NAME" "$WEB_APP_ID" --web-dir www
          npx cap add android
          sed -i "s/<activity/<activity android:screenOrientation=\"$WEB_ORIENTATION\"/" android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/app-debug.apk"

      - name: Итог сборки
        run: |
          AAPT2="$(ls $ANDROID_HOME/build-tools/*/aapt2 2>/dev/null | tail -1)"
          PKG="?"
          [ -n "$AAPT2" ] && PKG="$("$AAPT2" dump packagename out/app-debug.apk 2>/dev/null || echo '?')"
          ls -lh out/
          echo "### APK готов" >> "$GITHUB_STEP_SUMMARY"
          echo "ID приложения: \`$PKG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Тип: $TYPE, размер: $(du -h out/app-debug.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: out/app-debug.apk
          if-no-files-found: error
          retention-days: 14
